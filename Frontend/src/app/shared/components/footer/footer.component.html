<footer id="contact" aria-labelledby="footer-title" class="bg-gradient-to-br from-teal-950 via-emerald-950 to-teal-950 text-white">
	<div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
		<div class="grid gap-12 md:grid-cols-2 lg:grid-cols-[1.2fr_1fr_1fr] lg:gap-16">
			<div class="flex items-center justify-center">
				<a href="#top" class="inline-flex items-center gap-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-300 focus:ring-offset-4 focus:ring-offset-emerald-950" aria-label="Limpicii — înapoi sus">
					<img
						src="assets/images/LimpiciiLOGO-removedbg.png"
						alt=""
						class="h-32 w-32 object-contain sm:h-36 sm:w-36"
						loading="lazy"
					/>
				</a>
			</div>

			<div>
				<h2 class="text-sm font-bold uppercase tracking-[0.18em] text-amber-300">{{ 'NAV.CONTACT' | translate }}</h2>
				<ul class="mt-5 space-y-3">
					<li *ngFor="let contactLink of contactLinks" class="text-sm">
						<a class="group inline-flex min-h-10 items-center gap-3 rounded-md text-sm text-emerald-50 transition hover:text-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-300"
							[href]="contactLink.href"
							[attr.target]="contactLink.external ? '_blank' : null"
							[attr.rel]="contactLink.external ? 'noopener noreferrer' : null"
							[attr.aria-label]="(contactLink.label | translate) + ': ' + contactLink.value"
						>
							<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/10 transition-colors group-hover:bg-white/15">
								<ng-container [ngSwitch]="contactLink.icon">
									<svg
										*ngSwitchCase="'phone'"
										aria-hidden="true"
										class="h-5 w-5 text-amber-300"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 11.19 18a19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.09 3.18 2 2 0 0 1 4.08 1h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.06 8.94a16 16 0 0 0 6 6l1.31-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z" />
									</svg>

									<svg
										*ngSwitchCase="'email'"
										aria-hidden="true"
										class="h-5 w-5 text-amber-300"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<rect x="3" y="5" width="18" height="14" rx="2" />
										<path d="m3 7 9 6 9-6" />
									</svg>

									<svg
										*ngSwitchCase="'facebook'"
										aria-hidden="true"
										class="h-5 w-5 fill-current text-amber-300"
										viewBox="0 0 24 24"
									>
										<path d="M13.5 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.5 1.6-1.5h1.7V4c-.8-.1-1.8-.2-2.8-.2-2.8 0-4.7 1.7-4.7 4.9V10H6.5v3h2.8v8h4.2z" />
									</svg>
								</ng-container>
							</span>

							<span class="leading-6">{{ contactLink.value }}</span>
						</a>	
					</li>
				</ul>
			</div>

			<div>
				<h2 class="text-sm font-bold uppercase tracking-[0.18em] text-amber-300">{{ 'FOOTER.ORGANIZATION_DETAILS' | translate }}</h2>
				<address class="mt-5 space-y-3 text-sm not-italic leading-6 text-emerald-50">
					<p class="font-semibold">Asociaţia Club Sportiv Limpicii Braşov</p>
					<p>{{ 'FOOTER.ADDRESS' | translate }}</p>
					<p><span class="font-semibold text-white">{{ 'FOOTER.TAX_ID' | translate }}</span> 23731000</p>
				</address>
			</div>
		</div>

		<div class="mt-12 border-t border-white/15 pt-6 text-xs text-emerald-100/60 sm:flex sm:items-center sm:justify-center">
			<p>© {{ currentYear }} Asociația Club Sportiv Limpicii Brașov</p>
		</div>
	</div>
</footer>

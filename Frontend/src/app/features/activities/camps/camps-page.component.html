<main class="overflow-hidden bg-amber-50 text-slate-800">
  <!-- Introductory heading and short tagline -->
  <section
    class="mx-auto max-w-6xl px-6 pb-8 pt-14 md:pb-12 md:pt-20"
    aria-labelledby="camps-title"
  >
    <h1 id="camps-title" class="mx-auto max-w-4xl text-center text-3xl font-bold text-teal-950 md:text-4xl">
      {{ 'CAMPS.TITLE' | translate }}
    </h1>
    <p class="mx-auto mt-5 max-w-3xl text-center text-sm italic leading-6 text-slate-600 md:text-base md:leading-7">
      {{ 'CAMPS.INTRO' | translate }}
    </p>
  </section>

  <!-- Camp photo gallery: update each image and its alt text here -->
  <section
    class="mx-auto max-w-6xl px-6 pb-8 md:pb-12"
    aria-label="{{ 'CAMPS.GALLERY_LABEL' | translate }}"
  >
    <div class="grid gap-x-10 gap-y-8 md:grid-cols-3">
      <article>
        <img
          src="assets/images/camps/camp_Rimet.jpg"
          alt="Peisaj montan dintr-o tabără Limpicii"
          class="h-36 w-full rounded-xl object-cover"
        />
      </article>
      <article>
        <img
          src="assets/images/camps/hike_Moldoveanu.jpg"
          alt="Copiii Limpicii în drumeție spre Vârful Moldoveanu"
          class="h-36 w-full rounded-xl object-cover object-top"
        />
      </article>
      <article>
        <img
          src="assets/images/camps/camps_seaside.jpg"
          alt="Copiii Limpicii într-o tabără la mare"
          class="h-36 w-full rounded-xl object-cover"
        />
      </article>
    </div>
  </section>

  <!-- Camp description: each paragraph has its own translation key -->
  <section class="mx-auto max-w-3xl px-6 pb-24" aria-labelledby="camps-description-title">
    <h2 id="camps-description-title" class="sr-only">
      {{ 'CAMPS.DESCRIPTION_TITLE' | translate }}
    </h2>
    <p class="mt-2 text-center text-sm leading-7 text-slate-600 md:text-base md:leading-8">
      {{ 'CAMPS.DESCRIPTION' | translate }}
    </p>
    <p class="mt-4 text-center text-sm leading-7 text-slate-600 md:text-base md:leading-8">
      {{ 'CAMPS.DESCRIPTION_P1' | translate }}
    </p>
    <p class="mt-4 text-center text-sm leading-7 text-slate-600 md:text-base md:leading-8">
      {{ 'CAMPS.DESCRIPTION_P2' | translate }}
    </p>
    <p class=" text-center text-sm leading-7 text-slate-600 md:text-base md:leading-8">
      {{ 'CAMPS.DESCRIPTION_P3' | translate }}
    </p>
  </section>
</main>

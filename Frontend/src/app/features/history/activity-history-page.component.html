<main class="overflow-hidden bg-amber-50 text-slate-800">
  <section class="mx-auto mb-12 max-w-6xl px-6 pb-8 pt-14 md:pb-12 md:pt-20 " aria-labelledby="history-title">
    <p class="mb-3 text-center font-semibold uppercase tracking-[0.18em] text-emerald-700">{{ 'CLUB_HISTORY.EYEBROW' | translate }}</p>
    <h1 id="history-title" class="mx-auto max-w-4xl text-center text-3xl font-bold text-teal-950 md:text-4xl">{{ 'HISTORY.TITLE' | translate }}</h1>
    <div class="mx-auto mt-5 max-w-3xl space-y-3 text-center text-sm leading-6 text-slate-600 md:text-base md:leading-7">
      <p>{{ 'HISTORY.PARAGRAPH_ONE' | translate }}</p>
      <p>{{ 'HISTORY.PARAGRAPH_TWO' | translate }}</p>
    </div>

    <img
      src="assets/images/TITLU04-copy.jpg"
      [alt]="'HISTORY.IMAGE_ALT' | translate"
      class="mx-auto mt-10 block w-full max-w-5xl rounded-3xl object-contain shadow-md"
    />
  </section>

</main>

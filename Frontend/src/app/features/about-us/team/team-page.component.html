<main class="overflow-hidden bg-amber-50 text-slate-800">
  <section class="mx-auto max-w-6xl px-6 pb-8 pt-14 md:pb-12 md:pt-20" aria-labelledby="team-story-title">
    <p class="mb-3 text-center font-semibold uppercase tracking-[0.18em] text-emerald-700">{{ 'TEAM.EYEBROW' | translate }}</p>
    <h1 id="team-story-title" class="mx-auto max-w-4xl text-center text-3xl font-bold text-teal-950 md:text-4xl">{{ 'TEAM.TITLE' | translate }}</h1>
    <p class="mx-auto mt-5 max-w-3xl text-center text-sm leading-6 text-slate-600 md:text-base md:leading-7">{{ 'TEAM.STORY' | translate }}</p>

    <div class="mt-14 text-center">
      <p class="mb-3 font-semibold uppercase tracking-[0.18em] text-emerald-700">{{ 'TEAM.VOLUNTEERS_TITLE' | translate }}</p>
      <h2 class="text-3xl font-bold text-teal-950 md:text-4xl">{{ 'TEAM.MEET_US' | translate }}</h2>
    </div>

    <ul class="mt-10 grid grid-cols-1 justify-items-center gap-x-6 gap-y-12 sm:grid-cols-2 lg:grid-cols-5" aria-label="{{ 'TEAM.VOLUNTEERS_TITLE' | translate }}">
      @for (member of members; track member.name) {
        <li class="group w-full max-w-56 text-center">
          <div class="mx-auto flex aspect-square w-44 items-center justify-center rounded-full border-[6px] border-white bg-gradient-to-br {{ member.color }} shadow-lg ring-2 ring-emerald-100 transition duration-300 group-hover:-translate-y-1 group-hover:rotate-2 group-hover:shadow-xl" role="img" aria-label="{{ member.name }} — {{ 'TEAM.PHOTO_PLACEHOLDER' | translate }}">
            <span class="font-coiny text-5xl text-white drop-shadow-sm" aria-hidden="true">{{ member.initials }}</span>
          </div>
          <h3 class="mt-5 text-xl font-bold text-teal-950">{{ member.name }}</h3>
        </li>
      }
      
    </ul>
  </section>
</main>

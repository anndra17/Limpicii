<header class="relative w-full h-84 flex items-center justify-center overflow-hidden  shadow-xl">
	<img [src]="images[currentImage]" alt="Header image" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000" [class.opacity-0]="!showImage" [class.opacity-100]="showImage">
	<div class="relative z-10 text-center">
			<h1 class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-2xl tracking-wide">Bine ai venit la Limpicii!</h1>
			<p class="mt-2 text-lg md:text-xl text-white drop-shadow-lg font-semibold">Descoperă activitățile noastre în natură</p>
	</div>
	<div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10">
		<span *ngFor="let img of images; let i = index" class="w-3 h-3 rounded-full bg-white/70 border border-white transition-all duration-300" [class.bg-yellow-400]="i === currentImage"></span>
	</div>
		<div class="absolute inset-0 bg-black/40"></div>
</header>
<section class="w-full bg-white py-6">
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex flex-wrap md:flex-nowrap gap-2 md:gap-8 justify-between items-center">
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/tennisIcon.png" alt="Tenis" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Tenis</span>
			</div>
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/skiIcon.png" alt="Schi" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Schi</span>
			</div>
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/swimIcon.png" alt="Înot" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Înot</span>
			</div>
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/hikingIcon.png" alt="Drumeție" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Drumeție</span>
			</div>
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/iceskateingIcon.png" alt="Patinaj" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Patinaj</span>
			</div>
			<div class="flex flex-col items-center flex-1">
				<img src="assets/icons/gymnasticsIcon.png" alt="Gimnastică" class="w-10 h-10 md:w-16 md:h-16 object-contain" />
				<span class="mt-1 text-xs md:text-lg font-semibold text-gray-700">Gimnastică</span>
			</div>
	</div>
</section>

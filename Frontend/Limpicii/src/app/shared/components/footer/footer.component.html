<footer id="contact" aria-labelledby="footer-title" class="bg-gradient-to-br from-teal-950 via-emerald-950 to-teal-950 text-white">
	<div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
		<div class="grid gap-12 md:grid-cols-2 lg:grid-cols-[1.2fr_1fr_1fr] lg:gap-16">
			<div class="flex items-center justify-center">
				<a href="#top" class="inline-flex items-center gap-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-300 focus:ring-offset-4 focus:ring-offset-emerald-950" aria-label="Limpicii — înapoi sus">
					<img
						src="assets/images/LimpiciiLOGO-removedbg.png"
						alt=""
						class="h-32 w-32 object-contain sm:h-36 sm:w-36"
						loading="lazy"
					/>
				</a>
			</div>

			<div>
				<h2 class="text-sm font-bold uppercase tracking-[0.18em] text-amber-300">Contact</h2>
				<ul class="mt-5 space-y-4">
					<li *ngFor="let contactLink of contactLinks" class="text-sm">
						<span class="block text-xs font-semibold uppercase tracking-wider text-emerald-100/60">{{ contactLink.label }}</span>
						<a
							class="mt-1 inline-flex rounded-sm text-emerald-50 transition hover:text-amber-200 hover:underline focus:outline-none focus:ring-2 focus:ring-amber-300"
							[href]="contactLink.href"
							[attr.target]="contactLink.external ? '_blank' : null"
							[attr.rel]="contactLink.external ? 'noopener noreferrer' : null"
						>
							{{ contactLink.value }}
						</a>
					</li>
				</ul>
			</div>

			<div>
				<h2 class="text-sm font-bold uppercase tracking-[0.18em] text-amber-300">Datele asociației</h2>
				<address class="mt-5 space-y-3 text-sm not-italic leading-6 text-emerald-50">
					<p class="font-semibold">Asociaţia Club Sportiv Limpicii Braşov</p>
					<p>str. Tablei nr. 1, Mun. Brașov, România</p>
					<p><span class="font-semibold text-white">CUI:</span> 23731000</p>
				</address>
			</div>
		</div>

		<div class="mt-12 border-t border-white/15 pt-6 text-xs text-emerald-100/60 sm:flex sm:items-center sm:justify-center">
			<p>© {{ currentYear }} Asociația Club Sportiv Limpicii Brașov</p>
		</div>
	</div>
</footer>

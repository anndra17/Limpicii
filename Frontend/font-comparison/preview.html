<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparație fonturi — Limpicii</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #fbfaef; color: #123c37; }
    body { margin: 0; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 28px; color: #53615e; }
    section { margin: 0 auto 48px; max-width: 1500px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin: 0 0 8px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d9e7df; border-radius: 12px; }
    @media (max-width: 760px) { body { padding: 18px; } .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Comparație fonturi Limpicii</h1>
  <p class="intro">Capturi făcute la aceeași dimensiune, pe aceleași pagini. Apasă pe o captură pentru imaginea la dimensiunea completă.</p>

  <section><h2>Acasă</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-home.png"><img src="option-1-home.png" alt="Homepage cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-home.png"><img src="option-2-home.png" alt="Homepage cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>

  <section><h2>Despre noi</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-about.png"><img src="option-1-about.png" alt="Pagina Despre noi cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-about.png"><img src="option-2-about.png" alt="Pagina Despre noi cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>

  <section><h2>Echipă</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-team.png"><img src="option-1-team.png" alt="Pagina Echipă cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-team.png"><img src="option-2-team.png" alt="Pagina Echipă cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>

  <section><h2>Tenis</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-tennis.png"><img src="option-1-tennis.png" alt="Pagina Tenis cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-tennis.png"><img src="option-2-tennis.png" alt="Pagina Tenis cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>

  <section><h2>Știri</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-news.png"><img src="option-1-news.png" alt="Pagina Știri cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-news.png"><img src="option-2-news.png" alt="Pagina Știri cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>

  <section><h2>Contact</h2><div class="pair">
    <figure><figcaption>Varianta 1 · Coiny + Nunito</figcaption><a href="option-1-contact.png"><img src="option-1-contact.png" alt="Pagina Contact cu fonturile Coiny și Nunito"></a></figure>
    <figure><figcaption>Varianta 2 · Barlow Condensed + Barlow</figcaption><a href="option-2-contact.png"><img src="option-2-contact.png" alt="Pagina Contact cu fonturile Barlow Condensed și Barlow"></a></figure>
  </div></section>
</body>
</html>
